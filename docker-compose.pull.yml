# Run the stack from the pre-built multi-arch images on ghcr.io instead of
# building locally. This skips the expensive part of a first run - earshot's
# ffmpeg-from-source compile, which a Raspberry Pi 4 measures in hours.
#
# This is the DEFAULT: scripts/setup.sh writes COMPOSE_FILE and AMBI_BOX_TAG
# into a fresh .env, so plain `docker compose up -d` uses this file with the
# images of a pinned release. Without setup, the manual form is
#
#     docker compose -f docker-compose.yml -f docker-compose.pull.yml up -d
#
# which follows `latest` unless AMBI_BOX_TAG is set. Images are published for
# linux/amd64 and linux/arm64 by .github/workflows/ghcr-publish.yml on every
# version tag, with each architecture's ffmpeg verified GPL-clean before
# anything is pushed.
#
# The srt-gateway-owner service is not covered here (this file must not
# create the service for deployments that do not run it); setup writes it
# into docker-compose.override.yml pointing at the published srt-gateway
# image, so nothing builds in pull mode.
services:
  earshot:
    image: ghcr.io/mormegil6/ambisonic-box/earshot:${AMBI_BOX_TAG:-latest}
    build: !reset null
  loop-source:
    # reuses the earshot image, same as the base file
    image: ghcr.io/mormegil6/ambisonic-box/earshot:${AMBI_BOX_TAG:-latest}
  rtmp-ingest:
    image: ghcr.io/mormegil6/ambisonic-box/rtmp-ingest:${AMBI_BOX_TAG:-latest}
    build: !reset null
  hoast-player:
    image: ghcr.io/mormegil6/ambisonic-box/hoast-player:${AMBI_BOX_TAG:-latest}
    build: !reset null
  telemetry:
    image: ghcr.io/mormegil6/ambisonic-box/telemetry:${AMBI_BOX_TAG:-latest}
    build: !reset null
  srt-gateway:
    image: ghcr.io/mormegil6/ambisonic-box/srt-gateway:${AMBI_BOX_TAG:-latest}
    build: !reset null
