name: build

# Builds every image the stack builds, straight from docker-compose.yml via
# buildx bake. Bake reads the compose build definitions itself, so the build
# contexts can never drift from the ones compose actually uses - a hand-written
# matrix got hoast-player wrong on the first try (its context is the repo root,
# for the player submodule, not services/hoast-player).
#
# earshot is the expensive target: nginx-rtmp and an ffmpeg fork compiled from
# source, plus a node:12 webtools stage. Hence the layer cache - the first run
# is slow, later ones are near-instant unless those sources change.
#
# Deliberately amd64 only. The project targets arm64 too, but building that
# here means QEMU-emulating an ffmpeg compile, which is hours. Multi-arch
# belongs on a release job, not on every push.

on:
  push:
    branches: [main, 'ci-**']
    # A docs-only change cannot affect an image or the running stack, so it
    # does not need a 6-minute build. This is also the noise lever: fewer
    # runs on prose-only commits means fewer notification emails for pushes
    # that could not have broken anything. hygiene still runs on everything,
    # because it is the one that checks the docs themselves.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    name: build all images
    runs-on: ubuntu-latest
    # `docker buildx bake -f docker-compose.yml` interpolates the compose file
    # before it builds anything, and the two publish credentials are mandatory
    # there (`:?`, so a clone with no .env fails loudly instead of half-starting
    # a stack). This job has no .env, so it supplies throwaway values. They are
    # not credentials and reach no running service: the owner-key guard below
    # passes its own values with `docker run -e`, which is what actually
    # exercises the refusal.
    env:
      RTMP_OWNER_KEY: ci-interpolation-only-never-served
      LOOP_SOURCE_KEY: ci-interpolation-only-never-served
    steps:
      - uses: actions/checkout@v7
        with:
          # hoast-player's context is the repo root and it needs the patched
          # player, which is a submodule
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: build every compose target
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          # keep the images in the local docker daemon so later steps can
          # actually run them
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            rtmp-ingest.tags=ambi-box-rtmp-ingest:latest
            hoast-player.tags=ambi-box-hoast-player:latest

      - name: images are present
        run: docker images --filter 'reference=ambi-box-*' --format '  {{.Repository}}:{{.Tag}} {{.Size}}'

      - name: earshot is a redistributable build
        run: |
          # ENABLE_NONFREE=0 is what keeps published images GPL-clean; compose
          # sets it and the Dockerfile must still honour it. If the default
          # ever flips upstream, this is the line that notices.
          grep -q 'ARG ENABLE_NONFREE' services/earshot/src/Dockerfile \
            || { echo "::error::earshot Dockerfile no longer declares ENABLE_NONFREE"; exit 1; }
          if docker run --rm --entrypoint sh ambi-box-earshot:local -c \
               'ffmpeg -hide_banner -buildconf 2>&1 | grep -q -- --enable-nonfree'; then
            echo "::error::earshot was built with --enable-nonfree; images would not be redistributable"
            exit 1
          fi
          echo "earshot ffmpeg is nonfree-free"

      - name: the owner-key guard actually refuses the public placeholder
        run: |
          # Regression test for the 2026-08-09 fix: a clone that skips
          # setup.sh must NOT come up serving :1935 with a key that is printed
          # in the repository.
          set +e
          out=$(docker run --rm --entrypoint /entrypoint.sh \
                  -e LOOP_SOURCE_KEY=x -e RTMP_OWNER_KEY=hoast_demo_owner \
                  ambi-box-rtmp-ingest:latest 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] || { echo "::error::rtmp-ingest started with the public default owner key (rc=$rc)"; exit 1; }
          echo "$out" | grep -q 'REFUSING TO START' \
            || { echo "::error::refused, but without the explanatory message"; exit 1; }

          # ...and the documented opt-out still works
          set +e
          out2=$(timeout 6 docker run --rm --entrypoint /entrypoint.sh \
                   -e LOOP_SOURCE_KEY=x -e RTMP_OWNER_KEY=hoast_demo_owner \
                   -e ALLOW_DEFAULT_OWNER_KEY=1 ambi-box-rtmp-ingest:latest 2>&1)
          set -e
          echo "$out2" | grep -q 'WARNING: serving with the PUBLIC default' \
            || { echo "::error::ALLOW_DEFAULT_OWNER_KEY=1 no longer warns"; exit 1; }
          echo "guard refuses by default and warns when opted out"

      - name: the loop-source key is guarded the same way, and is scoped to one name
        run: |
          # Regression test for 2026-08-10. LOOP_SOURCE_KEY is checked inside
          # the OWNER application, so its committed default was a working
          # owner-publish credential for anyone who had read this repository:
          # `ffmpeg ... rtmp://host:1935/owner/<any-name>?token=hoast_demo` was
          # admitted, which preempts a guest and takes over the stream. Two
          # things fix it and both are asserted here, because either alone
          # leaves a hole: the key must be real, AND it must only work together
          # with the loop's own stream name.
          set +e
          out=$(docker run --rm --entrypoint /entrypoint.sh \
                  -e LOOP_SOURCE_KEY=hoast_demo -e RTMP_OWNER_KEY=real -e DASH_NAME=hoast_demo \
                  ambi-box-rtmp-ingest:latest 2>&1)
          rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 1 ] || { echo "::error::rtmp-ingest started with the public default LOOP_SOURCE_KEY (rc=$rc)"; exit 1; }
          echo "$out" | grep -q 'REFUSING TO START: LOOP_SOURCE_KEY' \
            || { echo "::error::refused, but not for the loop key"; exit 1; }

          # The rendered config must bind the token to the name. Checking the
          # generated nginx.conf rather than the template proves envsubst kept
          # $loop_auth intact - a bare envsubst would eat it and silently turn
          # the scope check into an always-false comparison.
          conf=$(docker run --rm --entrypoint sh \
                   -e LOOP_SOURCE_KEY=loopsecret -e RTMP_OWNER_KEY=ownersecret -e DASH_NAME=thestream \
                   ambi-box-rtmp-ingest:latest -c \
                   'mkdir -p /run/nginx && envsubst "\${LOOP_SOURCE_KEY} \${RTMP_OWNER_KEY} \${DASH_NAME}" < /etc/nginx/nginx.conf.template')
          echo "$conf" | grep -q '\$arg_name != .thestream.' \
            || { echo "::error::the loop token is no longer scoped to DASH_NAME"; exit 1; }
          echo "$conf" | grep -q 'set \$loop_auth' \
            || { echo "::error::envsubst ate \$loop_auth; the scope check would never match"; exit 1; }
          echo "loop key refused at its default, and scoped to the loop's own stream name"
