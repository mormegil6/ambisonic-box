name: integration

# The two suites that drive a real stack. These are the checks that would have
# caught the pipeline regressions this project has actually shipped, so they
# are the point of having CI at all - but they are also slow and stateful, so
# they do not run on every push to a topic branch.
#
#   test-pipeline.sh       ~3 min once images exist. Runs on PRs and main.
#   test-guest-endpoint.sh ~12 min, ten full cycles plus nine cases. Nightly
#                          and on demand, because it is long and because a
#                          flaky gate is worse than no gate.

on:
  pull_request:
  push:
    branches: [main]
    # A docs-only change cannot affect an image or the running stack, so it
    # does not need a 6-minute build. This is also the noise lever: fewer
    # runs on prose-only commits means fewer notification emails for pushes
    # that could not have broken anything. hygiene still runs on everything,
    # because it is the one that checks the docs themselves.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  schedule:
    # 04:20 UTC daily - well clear of any interactive work
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      run_guest_suite:
        description: 'Also run the long guest-endpoint suite'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pipeline:
    name: end-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: generate a real .env
        run: |
          # rtmp-ingest now REFUSES to start on the committed placeholder key,
          # so CI has to behave like a real install. Generating a key here also
          # means the happy path of that guard is exercised on every run.
          ./scripts/setup.sh
          # prove the guard's precondition rather than assuming setup.sh did it
          grep -qE '^RTMP_OWNER_KEY=(CHANGE_ME_this_default_is_public|hoast_demo_owner)?$' .env \
            && { echo "::error::setup.sh left a placeholder owner key"; exit 1; }
          echo "setup.sh generated a real owner key"

      - name: build images (warm cache from the build workflow)
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            rtmp-ingest.tags=ambi-box-rtmp-ingest:latest
            hoast-player.tags=ambi-box-hoast-player:latest

      - name: a running stack reports the version the repo claims
        run: |
          # hygiene checks that the two version FILES agree. This checks the
          # part that actually reaches a user: file -> image -> /api/live, the
          # number the dashboard and the player display and the bug report form
          # asks for. AMBI_VERSION is unset here on purpose, so this exercises
          # the fallback that a real deployment uses rather than the override.
          docker compose up -d telemetry
          v=''
          for _ in $(seq 1 20); do
            v=$(curl -sf --max-time 3 http://127.0.0.1:8090/api/live \
                | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
            [ -n "$v" ] && break
            sleep 2
          done
          want=$(tr -d ' \t\r\n' < telemetry/VERSION)
          if [ "$v" != "$want" ]; then
            echo "::error::/api/live reports '$v' but telemetry/VERSION says '$want'"
            docker compose logs --tail 40 telemetry || true
            docker compose down; exit 1
          fi
          echo "the running stack reports $v"
          docker compose down

      - name: synthesise demo content
        run: |
          # no committed media in the repo; the stack can make its own
          ./scripts/make-demo-loop.sh
          ls -la content/demo.mp4

      - name: test-pipeline.sh
        run: ./scripts/test-pipeline.sh

      - name: diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          for s in rtmp-ingest earshot telemetry loop-source; do
            echo "::group::$s"
            docker compose logs --tail 80 "$s" || true
            echo "::endgroup::"
          done

  srt:
    name: SRT and direct-to-DASH
    # The RECOMMENDED contribution route, and until 2026-08-10 it was the one
    # thing CI did not touch: `pipeline` drives RTMP, so an SRT or direct-path
    # regression would have left every job green. That is backwards for the
    # route the README tells people to use.
    #
    # Both suites are cheap enough to gate on. test-direct-session.sh is the
    # control plane only - real containers, real HTTP, real auth, no SRT and no
    # media - so it is fast and deterministic. test-srt-ingest.sh does push
    # media, but its SRT caller runs inside the compose network using the
    # gateway's own image, so the runner needs no libsrt-enabled ffmpeg.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GUEST_ENABLED: '1'    # both suites drive the guest route
      SRT_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: generate a real .env
        run: |
          # also generates GUEST_GW_SECRET, which the direct path's
          # /gw/session/* routes fail closed without
          ./scripts/setup.sh
          grep -q '^GUEST_GW_SECRET=' .env \
            || { echo "::error::setup.sh did not generate GUEST_GW_SECRET"; exit 1; }

      - name: build images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            rtmp-ingest.tags=ambi-box-rtmp-ingest:latest
            hoast-player.tags=ambi-box-hoast-player:latest

      - name: synthesise demo content
        run: ./scripts/make-demo-loop.sh

      - name: bring the stack up
        run: |
          docker compose up -d
          docker compose ps

      - name: test-direct-session.sh (session protocol conformance)
        run: ./scripts/test-direct-session.sh

      - name: test-srt-ingest.sh (a real SRT push, end to end)
        run: ./scripts/test-srt-ingest.sh

      - name: test-srt-ingest.sh on the republish fallback (GUEST_SRT_DIRECT=0)
        # The shipped default is the direct route (since 2026-08-21, when the
        # first real third-party session ran it end to end). The republish
        # fallback keeps coverage here because it is the only route that
        # interpolates the guest's name into the relay URL, so its sanitiser
        # must stay exercised even though no default runs it. The suite reads
        # the gateway's own mode and prints which route it proved.
        run: |
          GUEST_SRT_DIRECT=0 docker compose up -d srt-gateway
          ./scripts/test-srt-ingest.sh
          docker compose up -d srt-gateway   # back to the shipped default

      - name: diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          for s in srt-gateway rtmp-ingest earshot telemetry; do
            echo "::group::$s"
            docker compose logs --tail 120 "$s" || true
            echo "::endgroup::"
          done

  defaults:
    name: the shipped default is what the docs say
    # Cheap and per-push ON PURPOSE. Every other job here sets GUEST_ENABLED=1
    # because they exercise the guest endpoint, and both real deployments run it
    # enabled, so until 2026-08-11 nothing anywhere executed the default that
    # every clone inherits. A CI runner IS a fresh clone, which makes this the
    # natural place for it: no override, no .env beyond what setup.sh writes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: generate a real .env
        run: ./scripts/setup.sh

      - name: no guest override may leak in
        run: |
          # If setup.sh or a future change ever writes GUEST_ENABLED=1, this job
          # would still pass while testing the wrong thing. Fail loudly instead.
          if grep -qE '^GUEST_ENABLED=1' .env; then
            echo "::error::.env enables guests; this job only means something on the default"
            exit 1
          fi
          echo "default posture: GUEST_ENABLED is $(grep -E '^GUEST_ENABLED=' .env || echo 'unset')"

      - name: build images (warm cache from the build workflow)
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            rtmp-ingest.tags=ambi-box-rtmp-ingest:latest
            hoast-player.tags=ambi-box-hoast-player:latest

      - name: start the stack with no overrides
        run: |
          docker compose up -d rtmp-ingest telemetry earshot hoast-player
          for i in $(seq 1 30); do
            curl -sf --max-time 2 http://127.0.0.1:8090/api/live >/dev/null && break
            sleep 2
          done

      - name: test-defaults.sh
        run: ./scripts/test-defaults.sh

      - name: diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs rtmp-ingest --tail 40 || true
          docker compose logs telemetry --tail 20 || true

  guest:
    name: guest endpoint suite
    # long and stateful: nightly, or asked for explicitly
    if: github.event_name == 'schedule' || inputs.run_guest_suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: generate a real .env
        run: ./scripts/setup.sh

      - name: build images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            rtmp-ingest.tags=ambi-box-rtmp-ingest:latest
            hoast-player.tags=ambi-box-hoast-player:latest

      - name: synthesise demo content
        run: ./scripts/make-demo-loop.sh

      - name: test-guest-endpoint.sh
        env:
          GUEST_ENABLED: '1'
        run: ./scripts/test-guest-endpoint.sh

      - name: diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          for s in rtmp-ingest earshot telemetry loop-source srt-gateway; do
            echo "::group::$s"
            docker compose logs --tail 120 "$s" || true
            echo "::endgroup::"
          done
