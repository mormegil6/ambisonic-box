name: security

# What GitLab's scanners would have done, running where there is actually a
# runner. Scoped to what is useful for THIS project rather than everything on
# offer: telemetry is stdlib-only Python and there is no dependency manifest at
# the repo root, so dependency scanning has nothing to chew on; the value is in
# secrets, container CVEs, and static analysis of the two Python services and
# the player JS.
#
# Honest limitation, worth stating where someone will read it: none of these
# would have caught the bugs found by hand on 2026-08-09 (a misnested CSV
# write, two vacuous test assertions, 41 stale comments). Secret scanning in
# particular finds committed secrets, not a placeholder that is DOCUMENTED as
# the default - the hygiene workflow's own check covers that case.

on:
  push:
    branches: [main, 'ci-**']
    # A docs-only change cannot affect an image or the running stack, so it
    # does not need a 6-minute build. This is also the noise lever: fewer
    # runs on prose-only commits means fewer notification emails for pushes
    # that could not have broken anything. hygiene still runs on everything,
    # because it is the one that checks the docs themselves.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  schedule:
    - cron: '40 4 * * 1'   # Mondays, after the nightly integration run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks wants the whole history: this repo had a history purge in
          # July and carries placeholder credentials by design, so the tree
          # alone is not the interesting part
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    name: image CVEs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # bake interpolates docker-compose.yml before building, and the two publish
    # credentials are mandatory there (`:?`) so that a clone with no .env fails
    # on the user's terminal rather than inside a container. Throwaway values,
    # for interpolation only: this job builds and scans images, it starts none.
    env:
      RTMP_OWNER_KEY: ci-interpolation-only-never-served
      LOOP_SOURCE_KEY: ci-interpolation-only-never-served
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      # NO LAYER CACHE HERE, deliberately, unlike the build workflow. The images
      # patch their bases with `apk upgrade`, and Docker caches a RUN by its
      # instruction text rather than its result, so a cached layer skips that
      # upgrade entirely and the scan then describes a package set from whenever
      # the layer was first built. A scan that can silently test an image nobody
      # ships is worse than a slow one, so this job always builds from scratch
      # and pulls fresh bases. (Layer caching was NOT what produced the
      # CVE-2026-14456 failure on 2026-08-26; that was rtmp-ingest running only
      # `apk add`, which never upgrades what the base already carries. This
      # setting keeps the fix for it from being cached away.)
      - name: build images
        uses: docker/bake-action@v7
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.no-cache=true
            *.pull=true
            rtmp-ingest.tags=ambi-box-rtmp-ingest:latest
            hoast-player.tags=ambi-box-hoast-player:latest

      # The four images this project actually controls are gated. earshot is
      # scanned too but only reported: its webtools stage sits on
      # node:12.22.1-alpine3.12, so it carries CVEs nobody can fix from this
      # repository (that tree lives in a submoduled fork, not here), and
      # failing on them would train everyone to ignore this job.
      - name: scan the images we control
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ambi-box-rtmp-ingest:latest
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      # trivyignores is set HERE ONLY. telemetry ships docker-ce-cli for the
      # mounted socket, so Trivy sees the Go stdlib linked into that binary and
      # reports Go CVEs against this image; .trivyignore.yaml waives eight of
      # them until 2026-09-15, with the reachability argument and the retirement
      # test written out in the file. Scoping it to this step keeps the waiver
      # from silently covering the other three images.
      - name: scan telemetry
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ambi-box-telemetry:local
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml

      # trivyignores is set HERE ONLY, same reasoning as telemetry above.
      # .trivyignore-srt-gateway.yaml waives CVE-2026-53615 (libblkid, no fixed
      # package in trixie yet) with a traced dependency chain specific to this
      # image, kept in its own file rather than telemetry's so this waiver
      # cannot silently cover the other two images either.
      - name: scan srt-gateway
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ambi-box-srt-gateway:local
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore-srt-gateway.yaml

      - name: scan hoast-player
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ambi-box-hoast-player:latest
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: scan earshot (report only, submoduled fork)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ambi-box-earshot:local
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
