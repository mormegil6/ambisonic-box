name: arm64

# The Pi 4 is a first-class target (CLAUDE.md, and the README documents it as
# validated end to end), but the main build workflow is amd64 only because
# QEMU-emulating earshot's ffmpeg-from-source compile takes hours.
#
# This is the middle ground: really build the FOUR LIGHT images for arm64 under
# emulation, on a schedule rather than per-push. earshot is deliberately
# excluded - it is the slow one, it is vendored upstream, and the Pi builds it
# natively anyway (that is where the yarn --network-timeout fix came from).
#
# What this catches: an amd64-only dependency, an apt/apk package with no arm64
# build, architecture-specific compile flags. What it does NOT catch: runtime
# behaviour, thermals, or performance - those need the actual Pi, and emulated
# timings are meaningless for them.

on:
  schedule:
    - cron: '0 5 * * 1'   # Mondays, after the weekly security scan
  workflow_dispatch:
  push:
    # also on any change to how the images are built, since that is exactly
    # when an arch assumption sneaks in
    paths:
      - '**/Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/arm64.yml'

permissions:
  contents: read

jobs:
  build:
    name: arm64 build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: rtmp-ingest
            context: ./services/rtmp-ingest
          - service: telemetry
            context: ./telemetry
          - service: srt-gateway
            context: ./services/srt-gateway
          - service: hoast-player
            context: .
            dockerfile: services/hoast-player/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: build for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile || format('{0}/Dockerfile', matrix.context) }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.service }}
