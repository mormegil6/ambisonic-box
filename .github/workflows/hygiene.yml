name: hygiene

# Fast checks, no image builds. Every one of these guards a mistake this
# project has actually made - see the CI section of the deployment repo's
# PLAN.md for which incident each traces back to.

on:
  push:
    branches: [main, 'ci-**']
    # Tags too, because the version gate below has nothing to check a tag
    # against unless it runs on one. 20 seconds is a cheap thing to spend on
    # catching a release that disagrees with itself.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shell, python, yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shell syntax (every script must at least parse)
        run: |
          fail=0
          while IFS= read -r f; do
            head -1 "$f" | grep -qE '^#!.*\b(bash)\b' && sh="bash -n" || sh="sh -n"
            $sh "$f" || { echo "::error file=$f::syntax error"; fail=1; }
          done < <(git ls-files '*.sh')
          exit $fail

      - name: shellcheck (errors only for now; tighten later)
        run: |
          shellcheck --version
          # services/earshot/src is a VENDORED UPSTREAM fork - its scripts are
          # not this project's to restyle, and they carry `exit -1` (SC2242)
          # and shebang-less fragments that would permanently red this job.
          # Same scoping rule the 2026-08-09 comment sweep used.
          mapfile -t files < <(git ls-files '*.sh' | grep -v '^services/earshot/src/')
          printf '  linting %d scripts (vendored earshot excluded)\n' "${#files[@]}"
          # -S error keeps this a gate rather than a wall of style notes. The
          # migration-script incident that motivated it (`[ -e X ] && mv X Y`
          # under set -e) is SC2015-class, which is a warning, so warnings are
          # printed for visibility but only errors fail the job.
          shellcheck -S warning "${files[@]}" || true
          shellcheck -S error "${files[@]}"

      - name: python syntax
        run: |
          python3 -m compileall -q telemetry services/srt-gateway
          echo "ok"

      - name: yaml parses
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib
          bad = 0
          for p in list(pathlib.Path('.').rglob('*.yml')) + list(pathlib.Path('.').rglob('*.yaml')):
              if '.git' in p.parts or 'hoast360' in p.parts:
                  continue
              try:
                  yaml.safe_load(p.read_text())
              except Exception as e:
                  print(f"::error file={p}::{e}")
                  bad = 1
          sys.exit(bad)
          PY

  compose:
    name: compose resolves
    runs-on: ubuntu-latest
    # docker-compose.yml declares the two publish credentials MANDATORY (`:?`),
    # so that a clone with no .env fails on the user's own terminal instead of
    # inside a container nobody has been told to look in. A fresh checkout has
    # no .env, so CI has to behave like a real install and supply values. These
    # are not credentials: nothing here starts a service, they only let
    # interpolation succeed so the file itself can be validated.
    env:
      RTMP_OWNER_KEY: ci-interpolation-only-never-served
      LOOP_SOURCE_KEY: ci-interpolation-only-never-served
    steps:
      - uses: actions/checkout@v7

      - name: docker compose config is valid
        run: docker compose config --quiet

      - name: every image reference resolves to something buildable or pullable
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          cfg = json.loads(subprocess.check_output(
              ["docker", "compose", "config", "--format", "json"]))
          bad = 0
          for name, svc in cfg["services"].items():
              if not svc.get("build") and not svc.get("image"):
                  print(f"::error::service {name} has neither build nor image")
                  bad = 1
          print(f"checked {len(cfg['services'])} services")
          sys.exit(bad)
          PY

  vocabulary:
    name: no retired identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: retired names must not come back
        run: |
          # The 2026-08-09 rename took three sweeps by hand and still left
          # references behind, which is exactly why this is automated.
          # earshot's OWN `live` application is untouched and legitimate, so
          # every rule here excludes it explicitly rather than by hoping.
          #
          # Two files are exempt because they DESCRIBE these rules rather than
          # breaking them: this workflow, and docs/CI.md which documents it.
          # docs/CI.md was exempt for free while it lived in .github/; moving
          # it out (it was hijacking the repository front page) put it back in
          # scope and reddened main until this line was added.
          fail=0

          hit() { echo "::error file=$1,line=$2::$3"; fail=1; }

          # 1. the renamed env var must not be USED. Deliberately matches
          #    assignment and expansion rather than any mention: a comment
          #    naming the old variable while explaining the rename is useful
          #    history, not a defect, and loop-source's guard has exactly one.
          while IFS=: read -r f n rest; do
            hit "$f" "$n" "LIVE_APP_KEY was renamed to LOOP_SOURCE_KEY"
          done < <(git grep -nIE '\$\{?LIVE_APP_KEY|LIVE_APP_KEY=' -- . ':!.github' ':!docs/CI.md' ':!hoast360' || true)

          # 1b. SRT_PASSPHRASE was retired on 2026-08-10 for role-specific names
          #     (SRT_OWNER_PASSPHRASE / SRT_GUEST_PASSPHRASE), so that what you
          #     set in .env is what the container reads. Only the dangerous
          #     shape is matched - handing the old name to a container through a
          #     compose environment list - because the name is still referred to
          #     on purpose in three places: the gateway's refuse-to-start guard,
          #     setup.sh's .env migration, and the .env.example note explaining
          #     the change. Those are what make the retirement safe, not
          #     violations of it.
          while IFS=: read -r f n rest; do
            hit "$f" "$n" "SRT_PASSPHRASE was retired; use SRT_OWNER_PASSPHRASE or SRT_GUEST_PASSPHRASE"
          done < <(git grep -nIE '^[[:space:]]*#?[[:space:]]*-[[:space:]]*SRT_PASSPHRASE=' -- . ':!.github' ':!docs/CI.md' ':!hoast360' || true)

          # 2. rtmp-ingest's callback routes were renamed
          while IFS=: read -r f n rest; do
            hit "$f" "$n" "/rtmp/live/ was renamed to /rtmp/owner/"
          done < <(git grep -nI '/rtmp/live/' -- . ':!.github' ':!docs/CI.md' ':!hoast360' || true)

          # 3. :1935/live is rtmp-ingest's OLD app name - unless the host is
          #    earshot, whose own application really is still called `live`.
          while IFS=: read -r f n rest; do
            case "$rest" in
              *earshot:1935/live*) ;;
              *) hit "$f" "$n" "rtmp-ingest's app is /owner now (earshot's own /live is exempt)" ;;
            esac
          done < <(git grep -nI ':1935/live' -- . ':!.github' ':!docs/CI.md' ':!hoast360' || true)

          [ $fail -eq 0 ] && echo "no retired identifiers found"
          exit $fail

  docs-agree:
    name: docs match the compose default
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: FFMPEG_FLAGS default, README and .env.example agree
        run: |
          # docker-compose.yml's fallback is the single source of truth for the
          # video codec policy. These three drifted apart once and the shipped
          # stack failed its own test as a result, so the agreement is a gate.
          canonical=$(grep -o 'FFMPEG_FLAGS=\${FFMPEG_FLAGS:--[^}]*}' docker-compose.yml \
              | head -1 | sed 's/^FFMPEG_FLAGS=${FFMPEG_FLAGS:-//; s/}$//')
          [ -n "$canonical" ] || { echo "::error::no FFMPEG_FLAGS fallback in docker-compose.yml"; exit 1; }
          case "$canonical" in
              *"-c:v copy"*)   want="H.264 passthrough" ;;
              *"libvpx-vp9"*)  want="VP9" ;;
              *) echo "::error::unrecognised codec in compose fallback: $canonical"; exit 1 ;;
          esac
          grep -q "currently \*\*${want}\*\*" README.md \
              || { echo "::error file=README.md::README's stated default does not match the compose fallback ($want)"; exit 1; }
          grep -q '^FFMPEG_FLAGS=' .env.example \
              && { echo "::error file=.env.example::an ACTIVE FFMPEG_FLAGS line would override the compose default; keep it commented"; exit 1; }
          echo "compose, README and .env.example agree: $want"

      - name: no real-looking secret in the documentation
        run: |
          # 2026-08-10: an example URL was added to both OBS guides so a reader
          # could compare their own against something concrete, and the value
          # pasted into it was a REAL passphrase that scripts/setup.sh had just
          # generated on a test machine. Harmless in itself - throwaway install,
          # rotated since - but it is the wrong habit to publish, and a
          # realistic hex string is also the worst possible example, because it
          # invites the verbatim paste the example exists to prevent. The
          # replacement says what it is: th1s-is-n0t-your-passphrase-...
          #
          # Matches the ASSIGNMENT shape only, so a git SHA or a SHA-256 asset
          # checksum in prose stays fine. gitleaks does not cover this: the
          # value is not a recognised credential format, it is just hex.
          bad=$(git grep -nIE '(passphrase|PASSPHRASE|_KEY|_SECRET)=[0-9a-f]{32,}' \
                  -- 'docs/**' '*.md' ':!hoast360' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS=: read -r f n rest; do
              echo "::error file=$f,line=$n::a secret-shaped value in documentation; use an obviously fake placeholder"
            done
            exit 1
          fi
          echo "no secret-shaped values in the docs"

      - name: the public owner-key placeholder is never presented as usable
        run: |
          # README's settings table used to print `hoast_demo_owner` as the
          # stream key to type, which is the same hole as shipping a default
          # key. Two legitimate mentions are left: setup.sh's needs-generating
          # list and the startup guard that matches on it. docker-compose.yml
          # used to be a third, as the fallback value, and is deliberately no
          # longer excluded here: since the credential became mandatory (`:?`)
          # the literal is gone from that file and must not come back.
          # ':!.github' matters: without it this rule matches its own comment
          # and its own grep pattern, and the job fails on itself.
          bad=$(git grep -nI 'hoast_demo_owner' -- \
                  ':!scripts/setup.sh' \
                  ':!services/rtmp-ingest/entrypoint.sh' \
                  ':!.github' \
                  ':!hoast360' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS=: read -r f n rest; do
              echo "::error file=$f,line=$n::the placeholder owner key must not be presented as a usable credential"
            done
            exit 1
          fi
          echo "placeholder owner key is only referenced where it must be"

  version-agrees:
    name: version metadata agrees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: telemetry/VERSION, CITATION.cff and the tag say the same thing
        env:
          REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          # A running stack reports telemetry/VERSION on /api/live, and the bug
          # report form asks reporters for it, so a wrong number here sends
          # someone debugging the wrong commit. The number is only trustworthy
          # if it cannot silently drift from the tag or from CITATION.cff, and
          # `remember to bump it` is not a mechanism. scripts/set-version.sh
          # writes both files at once; this refuses a push where they disagree.
          import datetime, os, pathlib, re, sys, yaml

          fail = 0
          def err(msg):
              global fail
              print(f"::error::{msg}")
              fail = 1

          v_file = pathlib.Path("telemetry/VERSION").read_text().strip()
          cff = yaml.safe_load(pathlib.Path("CITATION.cff").read_text())
          v_cff = str(cff.get("version", "")).strip()
          released = cff.get("date-released")

          SEMVER = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$")

          if not SEMVER.match(v_file):
              err(f"telemetry/VERSION is '{v_file}', which is not X.Y.Z or X.Y.Z-marker")
          if v_cff != v_file:
              err(f"CITATION.cff says version '{v_cff}' but telemetry/VERSION says "
                  f"'{v_file}'. Use ./scripts/set-version.sh, which writes both.")

          # date-released is a string here, but stays valid if someone unquotes
          # it and YAML hands back a date object instead.
          if isinstance(released, datetime.date):
              released = released.isoformat()
          try:
              datetime.date.fromisoformat(str(released))
          except (TypeError, ValueError):
              err(f"CITATION.cff date-released is '{released}', not an ISO date")

          ref = os.environ.get("REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref[len("refs/tags/"):]
              if tag != f"v{v_file}":
                  err(f"tag {tag} does not match the version in the tree "
                      f"('{v_file}', so the tag should be v{v_file})")
              # -dev means "past a release, not itself released". Tagging one
              # would ship a stack that reports a version that was never cut.
              if "-dev" in v_file:
                  err(f"tag {tag} carries a -dev version. Run "
                      f"./scripts/set-version.sh {v_file.split('-dev')[0]} first.")
              if not fail:
                  print(f"tag {tag} agrees with both files, released {released}")
          else:
              if SEMVER.match(v_file) and "-" not in v_file:
                  # Not an error: `git push origin main v1.0.0` runs this on the
                  # branch as well as the tag, and on the branch there is no tag
                  # to check. It is a reminder that the bump back is still owed.
                  print(f"::notice::the tree claims to BE release {v_file} with no "
                        f"marker. After tagging, run ./scripts/set-version.sh "
                        f"<next>-dev so main stops claiming to be a release.")
              if not fail:
                  print(f"telemetry/VERSION and CITATION.cff agree: {v_file}")

          sys.exit(fail)
          PY

  arm64-bases:
    name: base images support arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: every FROM must publish a linux/arm64 variant
        run: |
          # CLAUDE.md's hard constraint: this stack deploys on a Raspberry Pi 4
          # as well as amd64, so "DO NOT use ARM-only base images" has an
          # equally important inverse - an amd64-only base silently breaks the
          # Pi. Actually BUILDING arm64 here means QEMU-emulating an ffmpeg
          # compile (hours), so this checks the manifests instead: seconds, and
          # it catches the regression at the only moment it is cheap to fix.
          # It does NOT prove the images build on arm64; that is what the Pi is
          # for. It proves the bases have not become amd64-only.
          fail=0
          bases=$(grep -hoE '^FROM [^ ]+'                     services/*/Dockerfile telemetry/Dockerfile                     services/earshot/src/Dockerfile 2>/dev/null                   | awk '{print $2}' | grep -v '^scratch$' | sort -u)
          for img in $bases; do
            case "$img" in *'$'*) echo "  skipping templated base: $img"; continue ;; esac
            arches=$(docker buildx imagetools inspect "$img" 2>/dev/null \
                       | grep -oE 'linux/(amd64|arm64)' | sort -u | tr '\n' ' ')
            case "$arches" in
              *arm64*) printf '  ok      %-30s %s\n' "$img" "$arches" ;;
              '')      echo "::error::could not inspect $img (network, or the tag is gone)"; fail=1 ;;
              *)       echo "::error::$img has no linux/arm64 variant - this would break the Pi 4 deployment"; fail=1 ;;
            esac
          done
          exit $fail
