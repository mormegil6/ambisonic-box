name: mirror to gitlab

# GitHub is this project's SOURCE OF TRUTH; git.pg.edu.pl is the mirror.
#
# That is the opposite of the operator's other repositories, which are all
# GitLab -> GitHub, so it is deliberate and worth explaining. Two reasons:
#   - contributions arrive on GitHub. Outside contributors cannot realistically
#     get accounts on a university GitLab, and merging their PRs on GitHub only
#     worked if GitHub were canonical - under the old direction GitLab
#     force-updated GitHub (keep_divergent_refs=false) and any merge made here
#     was silently reverted on the next push.
#   - CI runs here. git.pg.edu.pl has no runner available to this project, so
#     every gate lives on GitHub anyway (see docs/CI.md).
#
# The old GitLab -> GitHub push mirror has been DISABLED rather than deleted,
# so the previous arrangement can be restored by re-enabling it and removing
# this workflow.
#
# Auth is a GitLab DEPLOY KEY with push rights, scoped to this one project -
# not a personal token. Private half in the GITLAB_MIRROR_SSH_KEY secret.

on:
  push:
    branches: [main]
    tags: ['*']
  # A catch-up run, because push is not enough on its own. git.pg.edu.pl is a
  # university instance with maintenance windows, and a push that lands during
  # one fails correctly and then never retries: nothing re-triggers this job
  # until somebody happens to push again. On 2026-08-27 an 11:00 to 17:00
  # window did exactly that. Daily is plenty, since the mirror is a backup
  # rather than anything anyone reads.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # never let two mirror pushes race
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history and tags: the mirror should be a faithful copy, and a
          # shallow clone cannot be pushed as one
          fetch-depth: 0

      - name: load the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GITLAB_MIRROR_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 git.pg.edu.pl >> ~/.ssh/known_hosts 2>/dev/null

      - name: push main and tags to GitLab
        run: |
          git remote add gitlab git@git.pg.edu.pl:p829296/ambisonic-box.git
          # On the daily catch-up an unreachable GitLab is not news: it is a
          # maintenance window, and the next run picks it up. On a push it is
          # worth failing for, because that push is the thing that did not
          # arrive. Same job, different meaning, so only the schedule softens.
          if [ "${{ github.event_name }}" = "schedule" ] \
             && ! git ls-remote --exit-code gitlab >/dev/null 2>&1; then
            echo "gitlab unreachable on the scheduled run; the next one retries"
            exit 0
          fi
          # main only, plus tags. Deliberately NOT --mirror: that would delete
          # refs on GitLab that do not exist here, and would try to push every
          # dependabot/* branch into the university instance for no reason.
          git push gitlab "HEAD:refs/heads/main"
          # --force on tags, deliberately: GitHub is the source of truth, so a
          # tag that moved here must move on the mirror too. Without it a
          # re-cut tag wedges every later mirror run with "already exists"
          # (tags never fast-forward), which is exactly what the v1.0.0
          # re-tag did on release day. Branch pushes stay unforced.
          git push gitlab --force --tags
          echo "mirrored $(git rev-parse --short HEAD) to git.pg.edu.pl"

      - name: verify the two now agree
        run: |
          here=$(git rev-parse HEAD)
          there=$(git ls-remote gitlab refs/heads/main | awk '{print $1}')
          echo "  github: $here"
          echo "  gitlab: $there"
          # AT-OR-AHEAD, not equal. Cutting a release pushes the release commit
          # and then the "back to development" bump seconds later, so this job
          # routinely verifies after GitLab has legitimately moved past the
          # commit it was mirroring. Equality failed that twice (v1.0.1 and
          # v1.0.2) and reported a working mirror as broken. What actually
          # matters is whether this commit arrived, so test ancestry.
          # $there may be a commit this checkout predates (it was pushed after
          # this job started), so fetch it before asking about ancestry or
          # merge-base errors on an unknown object and the elif goes to else.
          git fetch -q gitlab main 2>/dev/null || true
          if [ "$here" = "$there" ]; then
            echo "  in sync"
          elif git merge-base --is-ancestor "$here" "$there" 2>/dev/null; then
            echo "  gitlab is ahead of this commit; it arrived and a later push followed"
          else
            echo "::error::mirror push did not take effect"; exit 1
          fi
