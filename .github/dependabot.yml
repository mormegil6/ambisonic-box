version: 2

# Deliberately narrow, and narrow for a REASON rather than for lack of targets.
# There IS a root package.json (http-server and playwright-core, the headless
# test harness) with a lockfile, so npm updates could be enabled here. They are
# not: those are dev-only tooling that never ships in an image or reaches a
# viewer, and playwright-core alone would open PRs faster than they are worth
# reading. Their real risk is CVEs, and Dependabot SECURITY ALERTS cover that
# without the version-bump noise - enabled on the repository, not here.
# telemetry needs nothing either way: it is stdlib-only Python with no manifest.
# The player's npm tree lives in the hoast360 submodule, a separate repository
# that has to be updated there.
#
# What IS worth watching is the CI itself, and the base images below - a pinned
# action that goes stale is how a pipeline quietly stops meaning what it says.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'CI'
    labels:
      - dependencies

  # Base images move faster than anything else here, and Container Scanning
  # only tells you a CVE exists - this is what proposes the bump.
  - package-ecosystem: docker
    directories:
      - /services/rtmp-ingest
      - /telemetry
      - /services/srt-gateway
      - /services/hoast-player
    schedule:
      interval: monthly
    commit-message:
      prefix: 'images'
    labels:
      - dependencies
