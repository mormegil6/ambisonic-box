name: ambisonic-box CodeQL scope

# Scope CodeQL to code this project can actually act on. Same rule the rest of
# the automation uses: submodule content is read, not maintained, here -
# alerts against it cannot be fixed in this repository and would train
# everyone to ignore the Security tab. This is belt-and-braces rather than
# load-bearing: `git ls-files`-based tooling never descends into submodule
# content regardless, and neither this workflow's checkout nor CodeQL's own
# scan initializes submodules here - but an explicit ignore survives that
# assumption changing later, which a silent absence would not.
paths-ignore:
  # the Envelop Earshot fork (mormegil6/Earshot)
  - services/earshot/src
  # the patched HOAST360 player (mormegil6/hoast360)
  - hoast360
  # generated/minified output, not sources
  - '**/dist'
