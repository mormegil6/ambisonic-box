# HOA 360° livestream stack - dev/local compose.
#
# Live path:  loop-source (or OBS ME) ──rtmp──▶ rtmp-ingest ──rtmp──▶ earshot
#             earshot transcodes to 16-ch Opus + video per FFMPEG_FLAGS (H.264 passthrough default, VP9 opt-in) and writes
#             live DASH into the dash-output volume ──▶ hoast-player serves it.
# shaka is a `tools`-profile utility (offline VOD packaging), NOT in the live
# path - it cannot ingest a 16-channel live stream.
#
# The RTMP contribution leg is H.264 + 16-ch AAC (PCE) by protocol necessity;
# VP9/Opus/WebM applies from earshot's transcode onward. See .env.example.

name: ambi-box

# Bounded container logs for every deployment (json-file has NO limits by
# default, so stdout grows forever). ~100 MB cap per service. Deployments
# that make a TIME-based retention promise (the guest disclaimer's 30 days)
# switch the driver to journald in their override and cap retention on the
# host; size caps alone cannot honour a days-based claim.
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  earshot:
    build:
      context: ./services/earshot/src
      args:
        # Redistributable by default: this stack links no nonfree library, so
        # ffmpeg's --enable-nonfree would only stamp the binary
        # non-redistributable (services/earshot/README.md section 7, upstream
        # PR #57). The upstream Dockerfile keeps the stock default; the STACK
        # opts out here so published images are clean. Set 1 to restore the
        # stock build.
        ENABLE_NONFREE: "${ENABLE_NONFREE:-0}"
    image: ambi-box-earshot:local
    environment:
      - HTTP_PORT=80          # must stay 80: upstream on_publish callback is hardcoded port-80
      - HTTPS_PORT=443
      - RTMP_PORT=1935
      - SSL_ENABLED=false
      # earshot:1935 is not host-published; auth is enforced at rtmp-ingest.
      # Empty token => earshot's /auth accepts the internal relay.
      - RTMP_AUTH_TOKEN=
      - RTMP_AUTH_URL=http://127.0.0.1:80/auth
      # Public DASH manifest filename. Fixed on purpose and decoupled from
      # RTMP_OWNER_KEY/LIVE_APP_KEY: the publish name used to name this file,
      # and any client on the public :1935 port chooses the publish name, so
      # an interpolated name was an arbitrary-path write inside earshot.
      # Defaulted to the literal the player is hardcoded to
      # (services/hoast-player/index.html), NOT to either key, so either
      # becomes a rotatable secret without moving the manifest URL. Validated
      # against [A-Za-z0-9_-]+ in the earshot entrypoint.
      - DASH_NAME=${DASH_NAME:-hoast_demo}
      # Video codec policy (audio is always 16-ch Opus, hardcoded upstream).
      # Default: video passthrough. This is the configuration the deployment
      # actually runs and the one the thermal numbers were measured on (39 %
      # CPU / 57.7 C on a 2012 quad-core test host). Video segments are then .m4s/.mp4
      # while audio stays Opus/WebM; hoast-player already serves both
      # (services/hoast-player/nginx.conf) and telemetry globs both.
      # With no -g at this stage the GOP is whatever the contribution encoder
      # sends. -seg_duration 2 is LOAD-BEARING, not tuning: an earlier version
      # of this comment claimed that omitting it made segments follow the
      # contribution keyframes at 2.002 s. That was a wrong model of the muxer,
      # and it shipped a real bug. Without -seg_duration the muxer targets its
      # DEFAULT 5 s: Opus cuts at exactly 5.000 s, but video under -c:v copy
      # can only close on a keyframe, so the 2.002 s contribution GOP produced
      # 6.006 s video segments. -window_size counts SEGMENTS, so the retained
      # DVR windows were 600.6 s of video against 499.4 s of audio, and seeking
      # into the ~100 s of scrub bar with video but no audio hung the player
      # silently and permanently (readyState 1, no error, no failed request;
      # found and root-caused 2026-08-08). With -seg_duration 2 both tracks cut
      # on the 2 s grid and the windows agree to ~0.2 s.
      # 2 rather than 2.002 on purpose: an external publisher sending an exact
      # 2.000 s GOP against a 2.002 target would close video at 4 s and
      # recreate the mismatch; against a 2 s target the demo master's 2.002 s
      # GOP leaves only that ~0.2 s residue across the whole window.
      # Realtime VP9 remains supported and is kept as a documented alternative
      # in .env.example. It is not the default because VP9 has been measured
      # TWICE on this host and both runs were over budget: 310 % CPU / 90.3 C at
      # half resolution, and 459.6 % CPU BELOW REALTIME at the unscaled 4K the
      # .env.example line would actually run. 4K VP9 is measured-and-failed here,
      # not untried, and that second run is the strongest argument for this
      # default. Conditions behind the numbers: README, "Video codec".
      # For the VP9 line, keep -g at segment duration x fps (-g 60 at 29.97/30,
      # -g 50 at 25) or the muxer cuts at the next keyframe past the target.
      # suggestedPresentationDelay >= 30 s is patched into the muxer itself
      # (services/earshot/src/Dockerfile, DASH_SPD_FLOOR) - no flag controls it.
      # SINGLE SOURCE OF TRUTH for the video codec policy. Everything else
      # (README, .env.example, scripts/test-pipeline.sh) must reference or
      # derive from this line, never restate it - they drifted apart once
      # and the shipped stack failed its own test as a result.
      - FFMPEG_FLAGS=${FFMPEG_FLAGS:--window_size 100 -seg_duration 2 -max_muxing_queue_size 1000 -c:v copy}
    volumes:
      # WIPED ON EVERY START. The entrypoint clears /opt/data/dash so a restart
      # begins a fresh DASH timeline (see services/earshot/README.md 2), and the
      # volume is bind-backed by ./output, so the host directory is emptied too.
      # Nothing that must survive a restart may live here.
      - dash-output:/opt/data/dash
      # Never touched by earshot: the entrypoint only clears .../dash. For test
      # harnesses, probe captures written from inside the container, and other
      # one-off files that have to outlive `docker compose up`.
      - ./scratch:/opt/data/scratch
    ports:
      # Loopback only: docs/ENDPOINTS.md marks this private, and /stat discloses
      # publisher and client IPs. Compose MERGES `ports` lists instead of
      # replacing them, so this has to be narrowed here; a plain override list
      # cannot remove a base mapping (removal needs `!override`/`!reset`).
      - "127.0.0.1:8081:80"   # dev only: webtools UI, /stat, /dash debug
    healthcheck:
      # /stat, not /: both answer 200 when the transcoder config is loaded, but
      # only /stat is defined BY that config. If the entrypoint ever fails to
      # render it and nginx falls back to the image's stock config, / still
      # serves a welcome page and reports healthy while nothing is transcoding.
      # /stat 404s in that state, so this turns a silent dead stream into a
      # failed healthcheck. (Measured: 200 against the real config, 404 against
      # a bare nginx:alpine.)
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/stat"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    # nginx-rtmp's exec child close()s every fd from 0 to sysconf(_SC_OPEN_MAX)
    # before execvp. A host whose containerd unit sets LimitNOFILE=infinity
    # hands the container 1073741816, turning that loop into ~19 min of
    # close()=EBADF at 100% CPU, so ffmpeg never starts and no DASH is written.
    # Any bounded value fixes it; 1024/524288 matches what an unaffected host
    # already gets. Found on a Raspberry Pi 4 (arm64); not architecture-specific
    # - it is whatever LimitNOFILE the host's containerd unit hands containers.
    ulimits:
      nofile:
        soft: 1024
        hard: 524288
    # Hardening, matching srt-gateway's block below where the service allows it.
    # NOT a clean cap_drop: [ALL] here: the vendored nginx-no-ssl.conf carries
    # `user nginx`, so the master starts as root and drops privileges (SETUID,
    # SETGID), the entrypoint chowns the DASH directory (CHOWN), and HTTP_PORT
    # is 80 (NET_BIND_SERVICE). Everything else goes.
    #
    # FOWNER is not optional, and dropping it fails in the worst possible way.
    # The vendored entrypoint runs `chown nginx /opt/data/dash && chmod 777
    # /opt/data/dash && ... && envsubst > /etc/nginx/nginx.conf` as ONE && chain
    # with no `set -e`. chmod on an inode the euid does not own needs FOWNER,
    # and the chown immediately before guarantees it is not owned. Without
    # FOWNER that chmod returns EPERM on any real Linux filesystem, the chain
    # aborts BEFORE the config is rendered, and the script falls through to a
    # bare `nginx` that loads the image's stock config: no rtmp block, no ffmpeg
    # exec, no DASH, while the container still answers :80 and reports healthy.
    # Verified directly on the deployment host (ext4): without FOWNER `chmod:
    # Operation not permitted`, with it the chain completes. It does NOT
    # reproduce on Docker Desktop, whose bind mounts fake ownership and permit
    # the chmod, so local testing cannot catch this one.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    # No read_only: the VENDORED entrypoint renders /etc/nginx/nginx.conf and
    # mkdirs /www at start (services/earshot/src/nginx-transcoder/entrypoint.sh).
    # Redirecting those into /run the way rtmp-ingest does would be a local
    # divergence to re-apply on every re-vendor, for a container that is not
    # itself internet-facing - rtmp-ingest is the one that meets the public.
    #
    # pids_limit bounds a fork bomb. No mem_limit deliberately: this container
    # runs the transcode on a 3 GB host, its working set is workload-dependent
    # (resolution, codec, viewer count), and an OOM-killed encoder is a worse
    # failure than the memory DoS a limit would bound.
    pids_limit: 512
    restart: unless-stopped
    logging: *bounded-logs

  rtmp-ingest:
    # NOTE: nginx-rtmp resolves the `push rtmp://earshot...` hostname ONCE at
    # startup. If earshot is recreated (new container IP), restart this service
    # too or the relay fails with "Connection refused" while DNS looks fine.
    build:
      context: ./services/rtmp-ingest
    environment:
      # loop-source's own low-stakes token; never reaches the public
      # internet (see nginx.conf.template's /auth comment for why it still
      # needs one at all)
      - LIVE_APP_KEY=${LIVE_APP_KEY:-hoast_demo}
      # the real public-facing owner secret: gates any /live publish arriving
      # by NAME (an OBS Stream Key push straight to :1935), the credential a
      # leak of which would actually matter. Rotate this in .env for any
      # deployment reachable from the internet.
      - RTMP_OWNER_KEY=${RTMP_OWNER_KEY:-hoast_demo_owner}
      # keyless guest test endpoint (rtmp://<host>:1935/guest); OFF by default,
      # see the README's guest section before enabling
      - GUEST_ENABLED=${GUEST_ENABLED:-0}
    ports:
      - "1935:1935"   # the only public ingest; OBS ME pushes here
    depends_on:
      earshot:
        condition: service_started   # push relay retries until earshot is up
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Hardening. This is the container that meets the public internet on 1935,
    # so it gets the full treatment including a read-only rootfs. Both its
    # ports are above 1024, so unlike earshot it needs no NET_BIND_SERVICE;
    # the three that remain are nginx's master-to-worker privilege drop.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    # The single writable path. entrypoint.sh renders nginx.conf and the guest
    # snippets into /run/nginx (the templates stay read-only in the image), and
    # nginx.conf.template points every *_temp_path there too, because nginx's
    # defaults live under /var/lib/nginx and that is not writable now.
    tmpfs:
      - /run
    pids_limit: 256
    mem_limit: 256m
    restart: unless-stopped
    logging: *bounded-logs

  loop-source:
    # reuses the earshot image: Envelop's PCE-aware ffmpeg guarantees the
    # 16-ch AAC headers earshot decodes, with the same multi-arch story.
    # Entrypoint logic lives in services/loop-source/ (mounted): demo-content
    # policy (synthesise a spherical placeholder when demo.mp4 is missing,
    # fetch the VOD masters from the pinned release), then the -c copy loop.
    image: ambi-box-earshot:local
    entrypoint: ["/bin/sh", "/opt/loop-source/entrypoint.sh"]
    environment:
      - LIVE_APP_KEY=${LIVE_APP_KEY:-hoast_demo}
      # the loop's publish NAME (the entrypoint reads it and defaulted to
      # hoast_demo all along; passing it keeps a custom DASH_NAME in step
      # with telemetry's copy, whose loop/owner discrimination keys on it)
      - DASH_NAME=${DASH_NAME:-hoast_demo}
      # Demo content, ON by default: synthesise content/demo.mp4 in-container
      # when missing (no network involved) and fetch the two VOD reference
      # masters from the pinned vod-clips release (~185 MB once, background,
      # SHA-256-pinned, fail-soft). 0 = neither: the loop idles until you
      # provide content/demo.mp4 yourself.
      - DEMO_CONTENT=${DEMO_CONTENT:-1}
      # Release base override; used by the test harness with a fixture server
      - DEMO_BASE_URL=${DEMO_BASE_URL:-}
      # VOD masters are only fetched when the VOD feature itself is on
      - VOD_ENABLED=${VOD_ENABLED:-0}
    volumes:
      # rw: the entrypoint writes the synthesised demo.mp4 and the fetched
      # VOD masters here (was ro when loop-source only ever read demo.mp4)
      - ./content:/content
      - ./services/loop-source:/opt/loop-source:ro
    depends_on:
      rtmp-ingest:
        condition: service_healthy
      earshot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof ffmpeg || pidof sleep"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *bounded-logs

  hoast-player:
    build:
      context: .
      dockerfile: services/hoast-player/Dockerfile
    environment:
      # On-demand VOD page + packaged clips; OFF by default. The stack's
      # purpose is live streaming; VOD is opt-in (see README). Independent of
      # DEMO_CONTENT, and VOD_ENABLED=0 also suppresses loop-source's
      # reference-master fetch.
      - VOD_ENABLED=${VOD_ENABLED:-0}
    volumes:
      - dash-output:/usr/share/nginx/html/dash:ro
      - status-public:/usr/share/nginx/html/status:ro   # curated telemetry (status.json)
      - ./content/vod/dash:/usr/share/nginx/html/vod-dash:ro   # on-demand VOD DASH clips
    ports:
      # Player HTTP. Defaults to loopback so `docker compose up` never exposes the
      # player directly on the LAN; the cloudflared tunnel and any local reverse
      # proxy reach it on localhost. PLAYER_BIND=0.0.0.0 restores all-interfaces;
      # to also reach it over Tailscale, add a second bind to the box's Tailscale
      # IP in an override (the same way :8090/:8081 are bound).
      - "${PLAYER_BIND:-127.0.0.1}:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/index.html"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Hardening. Port 80 (NET_BIND_SERVICE) plus the stock nginx image's
    # privilege drop and cache-dir chown at startup.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    # No read_only: the stock nginx entrypoint templates into /etc/nginx/conf.d
    # and 15-vod-enabled.sh writes vod-locations.conf and seds the served
    # index.html when VOD is off. Both write inside the image, so a read-only
    # rootfs needs that whole feature-gate reworked, not just a tmpfs.
    pids_limit: 256
    mem_limit: 256m
    restart: unless-stopped
    logging: *bounded-logs

  # Operations telemetry: private dashboard (:8090) + breakage-only Telegram
  # alerts + a curated public status.json for the player's status panel. Reads
  # container health/logs via the mounted docker socket; stream liveness from the
  # dash-output volume + earshot's /stat. Ships with the stack so any reuser gets
  # monitoring for free. CPU-temp/disk (Linux host) come from optional mounts in
  # docker-compose.override.yml; without them those fields simply read null.
  telemetry:
    build:
      context: ./telemetry
    image: ambi-box-telemetry:local
    environment:
      # Interpolated, not hardcoded: a hardcoded project name broke telemetry's
      # container control (loop start/stop, guest handover) the moment the
      # stack ran under any other project name. collect.py additionally
      # self-derives the project from its own container's compose label, which
      # also covers `docker compose -p <name>` (no env var involved).
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-ambi-box}
      - TEL_HOST=${TEL_HOST:-ambisonic-box}
      - FFMPEG_FLAGS=${FFMPEG_FLAGS:-}   # so it can report resolution/bitrate
      - BOT_TOKEN=${BOT_TOKEN:-}         # optional: Telegram alerts (unset = disabled)
      - CHAT_ID=${CHAT_ID:-}
      # On-demand source: stop the loop after this many minutes with nobody
      # watching; a visitor restarts it from the player. 0 disables idling and
      # keeps the stream running around the clock.
      - TEL_IDLE_STOP_MIN=${TEL_IDLE_STOP_MIN:-10}
      # Seconds of manifest a player needs before it can start. Must exceed the
      # player's live delay (30 s), or dash.js fails on the short timeline.
      - TEL_READY_S=${TEL_READY_S:-35}
      # Guest test endpoint (rtmp://<host>:1935/guest/<any-name>, no key).
      # Master switch (must match rtmp-ingest's), reconnect window after a
      # guest disconnects, and the absolute session cap (enforced within
      # ~10 s of expiry, via the on_update ping).
      - GUEST_ENABLED=${GUEST_ENABLED:-0}
      # OPTIONAL hardening for srt-gateway's real-caller-IP attribution. The
      # gateway is authenticated by its container address either way (a remote
      # publisher cannot forge nginx-rtmp's own addr=); setting this demands a
      # matching token as well. Leave empty for a working default.
      - GUEST_GW_SECRET=${GUEST_GW_SECRET:-}
      # only so the dashboard knows whether to list srt-gateway among the
      # live-path services (it runs either way, idle when off)
      - SRT_ENABLED=${SRT_ENABLED:-1}
      # the demo loop's PUBLISH NAME (it publishes /live/${DASH_NAME}), so
      # telemetry can tell the loop's own /live publish apart from an
      # EXTERNAL owner broadcast. Drives the owner-live latch: loop stopped
      # for the owner, guests refused while the owner is live. Deliberately
      # the NAME and not the key - the key never needs to enter this
      # container. Must stay in step with loop-source's DASH_NAME below.
      - DASH_NAME=${DASH_NAME:-hoast_demo}
      - GUEST_GRACE_S=${GUEST_GRACE_S:-120}
      - GUEST_MAX_S=${GUEST_MAX_S:-10800}
      # after a cap/kill-forced end, refuse guest publishes this long, so an
      # auto-reconnecting encoder cannot re-claim the slot instantly
      - GUEST_COOLDOWN_S=${GUEST_COOLDOWN_S:-300}
      # IP log retention and ban duration; ban is clamped to retention in
      # collect.py (ban expiry and IP redaction are the same event)
      - GUEST_RETENTION_DAYS=${GUEST_RETENTION_DAYS:-30}
      - GUEST_BAN_DAYS=${GUEST_BAN_DAYS:-30}
      # Resource guard: a guest must not be able to cook the host. Both OFF by
      # default (0) because the right numbers are a property of YOUR hardware,
      # not of this stack - measure with the deployment repo's thermal-ladder
      # harness. Temperature is the safety net (it sees room heat, dust and
      # soak); bitrate is only a coarse pre-filter. Enforced on the same 10 s
      # ping as the cap, after GUEST_LIMIT_STRIKES consecutive breaches.
      - GUEST_MAX_TEMP_C=${GUEST_MAX_TEMP_C:-0}
      - GUEST_MAX_MBPS=${GUEST_MAX_MBPS:-0}
      - GUEST_LIMIT_STRIKES=${GUEST_LIMIT_STRIKES:-3}
      # optional Cloudflare Web Analytics (VOD page arrivals on the dashboard);
      # both empty = feature off, panel hidden
      - CF_ANALYTICS_TOKEN=${CF_ANALYTICS_TOKEN:-}
      # reachability probes (see .env.example); empty = off
      - TUNNEL_METRICS_URL=${TUNNEL_METRICS_URL:-}
      - VOD_PROBE_URL=${VOD_PROBE_URL:-}
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID:-}
    volumes:
      # read health/logs, and start/stop the loop source for on-demand idling
      - /var/run/docker.sock:/var/run/docker.sock
      - telemetry-data:/data                            # private dashboard + history
      - status-public:/pub                              # curated public status.json
      - dash-output:/dash:ro                            # segment freshness
    ports:
      # localhost-only by default (never LAN-wide); a deployment adds a
      # private/Tailscale bind in docker-compose.override.yml.
      - "127.0.0.1:8090:8090"
    depends_on:
      - hoast-player
    # Hardening. Pure python on a high port, so unlike the three nginx
    # services it needs no capabilities at all.
    #
    # HONEST SCOPE: none of this contains the docker socket above, and that
    # is the real privilege here - socket access is the daemon's authority,
    # not a kernel capability, so cap_drop and read_only cannot touch it.
    # A `:ro` mount would not help either (the client needs write to talk at
    # all), and docker-socket-proxy does not either: giving telemetry the
    # CONTAINERS+POST it needs for start/stop also permits
    # POST /containers/create, which takes an arbitrary bind mount. What
    # actually bounds this is keeping :8090 off every network but the
    # tailnet, which the deployment override and the tailnet ACL do.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 256
    # 512m, not tighter: measured 207 MiB at idle (it buffers `docker logs`
    # windows), so a 384m ceiling sat at 54 % before any load. This container
    # IS the alerting path, and an OOM kill here is the one failure nothing
    # would report - the bound exists to catch a runaway, not to be approached.
    mem_limit: 512m
    restart: unless-stopped
    logging: *bounded-logs

  # SRT guest ingest: terminates SRT on public UDP 8890 (the only place the
  # real caller IP exists - ffmpeg listeners never see it, so bans could not
  # work without this) and republishes each session into rtmp-ingest's /guest
  # app, inheriting the whole arbiter lifecycle (slot, 3h cap, cooldown,
  # grace, bans, kill, stall, demo-loop interlock) from the existing
  # nginx-rtmp callbacks. Privilege-separated on purpose: this container
  # parses hostile pre-auth internet bytes, so it holds NO docker socket, NO
  # volumes, NO RTMP_OWNER_KEY, no capabilities, read-only rootfs. ON by default:
  # this is the recommended contribution path (stock OBS, one recipe on macOS
  # and Windows). It still admits nobody unless GUEST_ENABLED=1 - the arbiter
  # refuses every caller - so the port alone opens nothing. SRT_ENABLED=0
  # leaves it unbound entirely.
  srt-gateway:
    build:
      context: ./services/srt-gateway
    image: ambi-box-srt-gateway:local
    environment:
      - SRT_ENABLED=${SRT_ENABLED:-1}
      - SRT_LATENCY_MS=${SRT_LATENCY_MS:-2000}
      - SRT_PASSPHRASE=${SRT_PASSPHRASE:-}
      - GUEST_GW_SECRET=${GUEST_GW_SECRET:-}
      - XDG_CACHE_HOME=/tmp
    ports:
      # public-intent binding, so it must live in the BASE file: compose
      # merges ports lists, an override can widen but never narrow. The
      # container side is fixed at 8890; SRT_PORT moves only the host side.
      - "${SRT_PORT:-8890}:8890/udp"
    read_only: true
    # ffmpeg's fontconfig probes a cache dir on startup; without a writable
    # one every child spawn logs an error line. Nothing else writes.
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    depends_on:
      rtmp-ingest:
        condition: service_healthy
      telemetry:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging: *bounded-logs

  # Offline VOD packaging - NOT in the live path. Also drives the A/V-sync
  # measurement scripts (lip-sync-test/), which is why that dir is mounted.
  # Usage: docker compose run --rm shaka <packager args>
  shaka:
    image: google/shaka-packager:v3.7.2
    profiles: ["tools"]
    entrypoint: packager
    volumes:
      - dash-output:/output
      - ./content:/content:ro
      - ./lip-sync-test:/lip-sync-test
    restart: "no"

volumes:
  # dev: named volume backed by ./output so the test scripts
  # can watch segments on the host.
  # a production override can back this volume with tmpfs.
  dash-output:
    driver: local
    driver_opts:
      type: none
      o: bind
