# HOA 360° livestream stack - dev/local compose.
#
# Live path:  loop-source (or OBS ME) ──rtmp──▶ rtmp-ingest ──rtmp──▶ earshot
#             earshot transcodes to 16-ch Opus (+ VP9 by default) and writes
#             live DASH into the dash-output volume ──▶ hoast-player serves it.
# shaka is a `tools`-profile utility (VOD/lip-sync packaging), NOT in the live
# path - it cannot ingest a 16-channel live stream.
#
# The RTMP contribution leg is H.264 + 16-ch AAC (PCE) by protocol necessity;
# VP9/Opus/WebM applies from earshot's transcode onward. See .env.example.

name: hoa360

services:

  earshot:
    build:
      context: ./services/earshot/src
    image: hoa360-earshot:local
    environment:
      - HTTP_PORT=80          # must stay 80: upstream on_publish callback is hardcoded port-80
      - HTTPS_PORT=443
      - RTMP_PORT=1935
      - SSL_ENABLED=false
      # earshot:1935 is not host-published; auth is enforced at rtmp-ingest.
      # Empty token => earshot's /auth accepts the internal relay.
      - RTMP_AUTH_TOKEN=
      - RTMP_AUTH_URL=http://127.0.0.1:80/auth
      # Public DASH manifest filename. Fixed on purpose and decoupled from
      # STREAM_KEY: the publish name used to name this file, and any client on
      # the public :1935 port chooses the publish name, so an interpolated name
      # was an arbitrary-path write inside earshot. Defaulted to the literal the
      # player is hardcoded to (services/hoast-player/index.html), NOT to
      # ${STREAM_KEY}, so the key becomes a rotatable secret without moving the
      # manifest URL. Validated against [A-Za-z0-9_-]+ in the earshot entrypoint.
      - DASH_NAME=${DASH_NAME:-hoast_demo}
      # Video codec policy (audio is always 16-ch Opus, hardcoded upstream).
      # Default: video passthrough. This is the configuration the deployment
      # actually runs and the one the thermal numbers were measured on (39 %
      # CPU / 57.7 C; measured in the publication notes). Video segments are then .m4s/.mp4
      # while audio stays Opus/WebM; hoast-player already serves both
      # (services/hoast-player/nginx.conf) and telemetry globs both.
      # Two consequences of the shorter flag list, both deliberate: with no
      # -g at this stage the GOP is whatever the contribution encoder sends,
      # and with no -seg_duration the muxer falls back to its 5 s default,
      # cut at the next contribution keyframe. Add -seg_duration 2 back if you
      # need the 2 s cadence the VP9 default used.
      # Realtime VP9 remains supported and is kept as a documented alternative
      # in .env.example. It is not the default because the only VP9 config ever
      # measured cost 310 % CPU / 90.3 C at half resolution, and the unscaled
      # 4K variant has never been run outside the small synthetic test source.
      # For the VP9 line, keep -g at segment duration x fps (-g 60 at 29.97/30,
      # -g 50 at 25) or the muxer cuts at the next keyframe past the target.
      # suggestedPresentationDelay >= 30 s is patched into the muxer itself
      # (services/earshot/src/Dockerfile, DASH_SPD_FLOOR) - no flag controls it.
      # SINGLE SOURCE OF TRUTH for the video codec policy. Everything else
      # (README, .env.example, scripts/test-pipeline.sh) must reference or
      # derive from this line, never restate it - they drifted apart once
      # and the shipped stack failed its own test as a result.
      - FFMPEG_FLAGS=${FFMPEG_FLAGS:--window_size 100 -max_muxing_queue_size 1000 -c:v copy}
    volumes:
      - dash-output:/opt/data/dash
    ports:
      # Loopback only: docs/ENDPOINTS.md marks this private, and /stat discloses
      # publisher and client IPs. Compose MERGES `ports` lists instead of
      # replacing them, so this has to be narrowed here; an override cannot
      # remove a base mapping.
      - "127.0.0.1:8081:80"   # dev only: webtools UI, /stat, /dash debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  rtmp-ingest:
    # NOTE: nginx-rtmp resolves the `push rtmp://earshot...` hostname ONCE at
    # startup. If earshot is recreated (new container IP), restart this service
    # too or the relay fails with "Connection refused" while DNS looks fine.
    build:
      context: ./services/rtmp-ingest
    environment:
      - STREAM_KEY=${STREAM_KEY:-hoast_demo}
      # keyless guest test endpoint (rtmp://<host>:1935/guest); OFF by default,
      # see the README's guest section before enabling
      - GUEST_ENABLED=${GUEST_ENABLED:-0}
    ports:
      - "1935:1935"   # the only public ingest; OBS ME pushes here
    depends_on:
      earshot:
        condition: service_started   # push relay retries until earshot is up
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  loop-source:
    # reuses the earshot image: Envelop's PCE-aware ffmpeg guarantees the
    # 16-ch AAC headers earshot decodes, with the same multi-arch story.
    # Entrypoint logic lives in services/loop-source/ (mounted): demo-content
    # policy (synthesise a spherical placeholder when demo.mp4 is missing,
    # fetch the VOD masters from the pinned release), then the -c copy loop.
    image: hoa360-earshot:local
    entrypoint: ["/bin/sh", "/opt/loop-source/entrypoint.sh"]
    environment:
      - STREAM_KEY=${STREAM_KEY:-hoast_demo}
      # Demo content, ON by default: synthesise content/demo.mp4 in-container
      # when missing (no network involved) and fetch the two VOD reference
      # masters from the pinned vod-clips-v1 release (~373 MB once, background,
      # SHA-256-pinned, fail-soft). 0 = neither: the loop idles until you
      # provide content/demo.mp4 yourself.
      - DEMO_CONTENT=${DEMO_CONTENT:-1}
      # Release base override; used by the test harness with a fixture server
      - DEMO_BASE_URL=${DEMO_BASE_URL:-}
    volumes:
      # rw: the entrypoint writes the synthesised demo.mp4 and the fetched
      # VOD masters here (was ro when loop-source only ever read demo.mp4)
      - ./content:/content
      - ./services/loop-source:/opt/loop-source:ro
    depends_on:
      rtmp-ingest:
        condition: service_healthy
      earshot:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof ffmpeg || pidof sleep"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  hoast-player:
    build:
      context: .
      dockerfile: services/hoast-player/Dockerfile
    volumes:
      - dash-output:/usr/share/nginx/html/dash:ro
      - status-public:/usr/share/nginx/html/status:ro   # curated telemetry (status.json)
      - ./content/vod/dash:/usr/share/nginx/html/vod-dash:ro   # on-demand VOD DASH clips
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/index.html"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Operations telemetry: private dashboard (:8090) + breakage-only Telegram
  # alerts + a curated public status.json for the player's status panel. Reads
  # container health/logs via the mounted docker socket; stream liveness from the
  # dash-output volume + earshot's /stat. Ships with the stack so any reuser gets
  # monitoring for free. CPU-temp/disk (Linux host) come from optional mounts in
  # docker-compose.override.yml; without them those fields simply read null.
  telemetry:
    build:
      context: ./telemetry
    image: hoa360-telemetry:local
    environment:
      - COMPOSE_PROJECT_NAME=hoa360
      - TEL_HOST=${TEL_HOST:-hoa360}
      - FFMPEG_FLAGS=${FFMPEG_FLAGS:-}   # so it can report resolution/bitrate
      - BOT_TOKEN=${BOT_TOKEN:-}         # optional: Telegram alerts (unset = disabled)
      - CHAT_ID=${CHAT_ID:-}
      # On-demand source: stop the loop after this many minutes with nobody
      # watching; a visitor restarts it from the player. 0 disables idling and
      # keeps the stream running around the clock.
      - TEL_IDLE_STOP_MIN=${TEL_IDLE_STOP_MIN:-10}
      # Seconds of manifest a player needs before it can start. Must exceed the
      # player's live delay (30 s), or dash.js fails on the short timeline.
      - TEL_READY_S=${TEL_READY_S:-35}
      # Guest test endpoint (rtmp://<host>:1935/guest/<any-name>, no key).
      # Master switch (must match rtmp-ingest's), reconnect window after a
      # guest disconnects, and the absolute session cap (enforced within
      # ~10 s of expiry, via the on_update ping).
      - GUEST_ENABLED=${GUEST_ENABLED:-0}
      - GUEST_GRACE_S=${GUEST_GRACE_S:-120}
      - GUEST_MAX_S=${GUEST_MAX_S:-10800}
      # after a cap/kill-forced end, refuse guest publishes this long, so an
      # auto-reconnecting encoder cannot re-claim the slot instantly
      - GUEST_COOLDOWN_S=${GUEST_COOLDOWN_S:-300}
    volumes:
      # read health/logs, and start/stop the loop source for on-demand idling
      - /var/run/docker.sock:/var/run/docker.sock
      - telemetry-data:/data                            # private dashboard + history
      - status-public:/pub                              # curated public status.json
      - dash-output:/dash:ro                            # segment freshness
    ports:
      # localhost-only by default (never LAN-wide); a deployment adds a
      # private/Tailscale bind in docker-compose.override.yml.
      - "127.0.0.1:8090:8090"
    depends_on:
      - hoast-player
    restart: unless-stopped

  # VOD/lip-sync packaging utility (Phase 5) - NOT in the live path.
  # Usage: docker compose run --rm shaka <packager args>
  shaka:
    image: google/shaka-packager:v3.7.2
    profiles: ["tools"]
    entrypoint: packager
    volumes:
      - dash-output:/output
      - ./content:/content:ro
      - ./lip-sync-test:/lip-sync-test
    restart: "no"

volumes:
  # dev: named volume backed by ./output so the test scripts
  # can watch segments on the host.
  # prod (docker-compose.prod.yml, Phase 7) switches this to tmpfs.
  dash-output:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/output
  # telemetry dashboard + history (private; only the telemetry service mounts it)
  telemetry-data:
  # curated public status.json, shared telemetry -> hoast-player (no box internals)
  status-public:
