# Guest-endpoint arbiter proxy (http block half; see guest-rtmp.conf).
# Included only when GUEST_ENABLED=1. The rtmp block cannot resolve service
# names at request time (hostnames in push/on_* are resolved once at startup,
# the reason rtmp-ingest must restart when earshot is recreated). Routing the
# notify callbacks through these locations with docker's embedded DNS
# resolver means telemetry can be recreated freely without restarting ingest.
# This port is not published to the host; only the compose network reaches it.

# publish is FAIL-CLOSED on purpose: telemetry unreachable -> 502 ->
# nginx-rtmp rejects the publish, while the token-authed live app keeps
# working.
location = /guest/publish {
    resolver 127.0.0.11 valid=5s;
    set $arbiter http://telemetry:8090;
    proxy_pass $arbiter/rtmp$request_uri;
    proxy_read_timeout 15s;    # on_publish is held during loop handover
}

# update/done are FAIL-OPEN: a telemetry restart briefly answers 502 here,
# and with notify_update_strict off nginx-rtmp would tolerate a CONNECTION
# error but treats a well-formed non-2xx as a deliberate drop, killing an
# innocent ongoing session. Masking only the gateway-generated 502/504 as 204
# keeps a mid-session telemetry restart invisible; deliberate drops (403 from
# the arbiter) pass through untouched, and the arbiter's stale-session
# backstops cover anything missed while it was down.
location /guest/ {
    resolver 127.0.0.11 valid=5s;
    set $arbiter http://telemetry:8090;
    proxy_pass $arbiter/rtmp$request_uri;
    proxy_read_timeout 10s;
    error_page 502 504 = @guest_tolerate;
}

location @guest_tolerate {
    return 204;
}
