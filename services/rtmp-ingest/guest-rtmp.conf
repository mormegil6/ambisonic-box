# Public guest test endpoint (rtmp block half; the http half lives in
# guest-http.conf). Included only when GUEST_ENABLED=1; the entrypoint writes
# an empty include otherwise, so a default deployment has no keyless
# application at all. No key, any stream name, one publisher at a time.
# Telemetry is the arbiter (accept/reject, pausing the demo loop, the
# reconnect grace, the session cap and the forced-end cooldown); these
# callbacks reach it through the proxy in guest-http.conf so the hostname is
# resolved per request, not once at startup. If telemetry is down the
# callbacks fail and nginx-rtmp rejects the publish: the guest endpoint fails
# closed while the token-authed live app keeps working.
application guest {
    live on;
    # watching happens on the player page; raw RTMP play here would only add
    # update_play notify noise and invisible lurkers
    deny play all;
    # a vanished publisher (no clean RTMP teardown) must unpublish quickly or
    # the slot hangs until TCP notices
    drop_idle_publisher 10s;
    on_publish      http://127.0.0.1:8080/guest/publish;
    on_publish_done http://127.0.0.1:8080/guest/done;
    # liveness ping every 10 s; a non-2xx reply DROPS the publisher, which is
    # how the arbiter enforces the session cap and the dashboard's
    # end-session button (no rtmp_control needed)
    on_update       http://127.0.0.1:8080/guest/update;
    notify_update_timeout 10s;
    # same relay as the live app; the arbiter guarantees the demo loop is
    # unpublished first, so earshot never sees two writers
    push rtmp://earshot:1935/live;
}
