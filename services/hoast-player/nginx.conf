# HOAST360 player + DASH origin.
# COOP/COEP are required project-wide; ACAO * so the player can be
# embedded / fetched cross-origin. NB: `add_header` is NOT inherited into
# locations that declare their own add_header, so the full set is repeated.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Access-Control-Allow-Origin * always;

    location / {
        try_files $uri $uri/ =404;
    }

    # live DASH segments from the shared dash-output volume
    location /dash/ {
        types {
            application/dash+xml mpd;
            video/webm webm;
            video/iso.segment m4s;
            video/mp4 mp4;
            audio/mp4 m4a;
        }

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers Content-Length always;
        add_header Cache-Control no-cache always;
    }
}
