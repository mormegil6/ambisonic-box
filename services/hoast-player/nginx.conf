# HOAST360 player + DASH origin. (v2: logs real viewer IP + country via the `cf`
# format defined in 00-logformat.conf, so telemetry sees clients behind the tunnel.)
# COOP/COEP are required project-wide; ACAO * so the player can be embedded /
# fetched cross-origin. NB: add_header is NOT inherited into locations that
# declare their own add_header, so the full set is repeated.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout cf;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Access-Control-Allow-Origin * always;

    location / {
        try_files $uri $uri/ =404;
    }

    # curated public telemetry (status-public volume, written by the telemetry
    # service). Served fresh; the status panel re-polls it.
    location /status/ {
        default_type application/json;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-cache always;
    }

    # live DASH segments from the shared dash-output volume
    location /dash/ {
        types {
            application/dash+xml mpd;
            video/webm webm;
            video/iso.segment m4s;
            video/mp4 mp4;
            audio/mp4 m4a;
        }

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers Content-Length always;
        add_header Cache-Control no-cache always;
    }
}
