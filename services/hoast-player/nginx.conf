# HOAST360 player + DASH origin. (v2: logs real viewer IP + country via the `cf`
# format defined in 00-logformat.conf, so telemetry sees clients behind the tunnel.)
# COOP/COEP are required project-wide; ACAO * so the player can be embedded /
# fetched cross-origin. NB: add_header is NOT inherited into locations that
# declare their own add_header, so the full set is repeated.

# On-demand source control. Only the two harmless verbs are proxied: readiness
# (a read) and start (idempotent, so the worst a flood achieves is the stream
# running, which is the normal state). /api/stop is deliberately NOT proxied and
# stays on the telemetry port, which is bound to localhost/VPN, because stopping
# is the one verb a visitor could use to ruin the demo for everyone else.
limit_req_zone $binary_remote_addr zone=startreq:1m rate=6r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout cf;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Access-Control-Allow-Origin * always;

    # The live player page. Split out from the static catch-all below purely so
    # it can carry Cache-Control: without it the page has only ETag and
    # Last-Modified, and a browser may reuse it heuristically without ever
    # revalidating - so a rebuilt player does not reach anyone who has already
    # visited until they hard-reload. Assets keep the catch-all's caching; the
    # page names its bundle with a ?v= buster, so revalidating the 40 kB of HTML
    # each load costs nothing.
    location = / {
        try_files /index.html =404;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # curated public telemetry (status-public volume, written by the telemetry
    # service). Served fresh; the status panel re-polls it.
    location /status/ {
        default_type application/json;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-cache always;
    }

    # cheap liveness/readiness probe, polled every few seconds while a visitor
    # waits out a cold start (the 60 s telemetry cycle is far too slow for that)
    location = /api/live {
        # same resolve-at-request-time treatment as /api/start below: with a
        # literal upstream, nginx resolves at startup and refuses to start at all
        # when telemetry is absent, taking the whole public player down with an
        # optional service.
        resolver 127.0.0.11 valid=10s;
        set $telemetry_live telemetry:8090;
        proxy_pass http://$telemetry_live/api/live;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-store always;
    }

    location = /api/start {
        limit_except POST { deny all; }
        limit_req zone=startreq burst=3 nodelay;
        # resolve at request time via docker's embedded DNS: a telemetry
        # restart on a new IP would otherwise leave this worker proxying a
        # dead address for its lifetime, and an absent telemetry would abort
        # nginx startup on a service the player treats as optional
        resolver 127.0.0.11 valid=10s;
        set $telemetry telemetry:8090;
        proxy_pass http://$telemetry/api/start;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-store always;
    }

    # live DASH segments from the shared dash-output volume
    location /dash/ {
        types {
            application/dash+xml mpd;
            video/webm webm;
            video/iso.segment m4s;
            video/mp4 mp4;
            audio/mp4 m4a;
        }

        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers Content-Length always;
        add_header Cache-Control no-cache always;
    }

    # VOD player: the unified index.html handles both live and VOD, keyed off the
    # request path (/ = live, /vod/ = on-demand clips).
    # On-demand VOD (page + packaged DASH). The entrypoint script
    # 15-vod-enabled.sh includes the real locations when VOD_ENABLED=1 and
    # 404 stubs otherwise, so a disabled deployment serves no VOD surface at
    # all (the stubs also stop /vod-dash/ falling through to `location /`,
    # which would serve the mounted files without the COOP/CORS headers).
    include /etc/nginx/vod-locations.conf;

}
