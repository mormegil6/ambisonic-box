# v2 telemetry: real viewer identity behind the Cloudflare tunnel.
# cloudflared forwards CF-Connecting-IP (real client) and CF-IPCountry (2-letter).
# Fall back to the direct peer when a request didn't come through Cloudflare
# (LAN/healthcheck), and to "--" when there's no country.
map $http_cf_connecting_ip $viewer_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
map $http_cf_ipcountry $viewer_cc {
    ""      "--";
    default $http_cf_ipcountry;
}
log_format cf '$viewer_ip $viewer_cc "$request" $status';
