# Telemetry log format: real viewer identity behind the Cloudflare tunnel.
# cloudflared forwards CF-Connecting-IP (real client) and CF-IPCountry (2-letter).
# This access log is what telemetry counts viewers and countries from, and both
# headers are trivially forged, so they are honoured only when the request really
# arrived from the tunnel. Otherwise fall back to the direct peer (LAN, health
# check) and "--", exactly as before.
#
# What "from the tunnel" is, concretely: cloudflared runs on the HOST and connects
# to the published port, so the peer nginx sees is never a Cloudflare edge address
# and cannot be allowlisted as one. Host-local traffic into a published port is
# SNATed to the compose network's bridge gateway (172.16.0.0/12 under Docker's
# default address pool), while a client arriving from off-box keeps its own source
# address through the DNAT. That asymmetry is the whole discriminator here.
# Adjust the ranges if this host's Docker address pool is not the default, or if
# its LAN lives inside 172.16.0.0/12; erring wide re-opens the forgery.
geo $remote_addr $from_tunnel {
    default       0;
    127.0.0.0/8   1;   # same-netns probes
    172.16.0.0/12 1;   # docker bridge gateway == the host, i.e. cloudflared
}

# Key is trust flag + header, so one map expresses both conditions. A trusted peer
# that sent no header yields the bare "1", matches no regex, and falls through to
# the peer address. The character class is not an address validator (collect.py
# does that); it excludes spaces and quotes so a header can never add or shift a
# field in the log line, and anything outside it falls back to $remote_addr.
map $from_tunnel$http_cf_connecting_ip $viewer_ip {
    default                  $remote_addr;
    "~^1([0-9A-Fa-f.:]+)$"   $1;
}
# Country is published verbatim in the public status.json, hence the two-letter
# constraint on top of the trust check.
map $from_tunnel$http_cf_ipcountry $viewer_cc {
    default                  "--";
    "~^1([A-Za-z]{2})$"      $1;
}
log_format cf '$viewer_ip $viewer_cc "$request" $status';
