# On-demand VOD locations, included by nginx.conf when VOD_ENABLED=1.
# When disabled, 15-vod-enabled.sh writes 404 stubs in this file's place.
    location = /vod { return 301 /vod/; }
    location = /vod/ {
        try_files /index.html =404;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        # Without this the page carries only ETag/Last-Modified, and browsers
        # are free to reuse it heuristically without revalidating - so a deploy
        # does not reach anyone who has already visited until they hard-reload.
        # The page is small and names its own bundle with a ?v= buster, so
        # revalidating it every load costs nothing and keeps deploys honest.
        add_header Cache-Control "no-cache" always;
    }

    # On-demand VOD DASH (content/vod/dash mounted read-only). Cacheable, unlike
    # the live /dash/: the segments are immutable, so looping/rewatching replays
    # from cache instead of refetching.
    location /vod-dash/ {
        types {
            application/dash+xml mpd;
            video/mp4 mp4;
            audio/webm webm;
            text/vtt vtt;
        }
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Expose-Headers Content-Length always;
        # no-cache (revalidate), not max-age: VOD DASH is re-packaged during
        # iteration, and a long TTL pins stale segments in the browser.
        add_header Cache-Control "no-cache" always;
    }
